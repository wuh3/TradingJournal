services:
  db:
    image: postgres:16-alpine
    container_name: trading_journal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tj_password}
      POSTGRES_DB: ${POSTGRES_DB:-trading_journal}
    ports:
      - "5432:5432"
    volumes:
      - tj_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tj_user} -d ${POSTGRES_DB:-trading_journal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tj_pgdata:
